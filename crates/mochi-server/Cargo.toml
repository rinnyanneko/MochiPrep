version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true }
http-body-util = { workspace = true }
mochi-core = { path = "../mochi-core" }
mochi-domain = { path = "../mochi-domain" }
mochi-market = { path = "../mochi-market" }
mochi-store = { path = "../mochi-store" }
rand = { workspace = true }
