<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MochiPrep: Settings</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body class="settings">
  <main class="scroll">
    <h1>Settings</h1>
    <form id="settings-form" class="form">
      <label class="field">
        <span>Port</span>
        <input type="text" id="port" inputmode="numeric" autocomplete="off" required>
      </label>
      <p class="note">Changing the port resets the interface's saved preferences, because they belong to the old address.</p>
      <label class="check"><input type="checkbox" id="autostart"> Start MochiPrep when I log in</label>
    </form>
  </main>

  <footer class="actions">
    <p id="saved" class="hint" hidden>Saved.</p>
    <p id="error" class="error" role="alert" hidden></p>
    <button type="submit" form="settings-form" id="save" class="primary">Save</button>
  </footer>

  <script src="launcher.js"></script>
</body>
</html>
