<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MochiPrep: Import existing data</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body class="import">
  <main class="scroll">
    <h1>Import existing data</h1>
    <p>Import existing data from a .mochiprep folder? Your data is copied; the original stays where it is.</p>
  </main>

  <footer class="actions">
    <p id="working" class="hint" hidden>Copying…</p>
    <p id="error" class="error" role="alert" hidden></p>
    <button type="button" id="skip">Skip</button>
    <button type="button" id="import" class="primary">Import existing data…</button>
  </footer>

  <script src="launcher.js"></script>
</body>
</html>
