name: Release

# A tag `vX.Y.Z` builds all six targets and fills a DRAFT release. Publishing it is the owner's
# action; nothing here publishes.
#
# The draft is created once, up front, and every later job addresses it by id: GitHub's lookup by
# tag does not see drafts. latest.json is written once, after all legs have uploaded.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

  draft:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # check-version has accepted it as vX.Y.Z, so it is safe inside the jq filter below.
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run reuses the draft it created; a published release is never touched.
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          if [ "$(printf '%s' "$found" | grep -c .)" -gt 1 ]; then
            echo "::error::More than one release exists for $TAG; delete the extra drafts and re-run."
            exit 1
          fi
          if [ -n "$found" ]; then
            read -r id draft <<< "$found"
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to change it."
              exit 1
            fi
            echo "Reusing draft $id for $TAG."
          else
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="MochiPrep $TAG" -f body="Draft: notes follow" -F draft=true \
              --jq .id)
            echo "Created draft $id for $TAG."
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    # build.yml cannot exceed these permissions, and tauri-action needs write to upload assets.
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      sign-updater: true
      upload-release: true
      release-id: ${{ needs.draft.outputs.release-id }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  manifest:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Binary transfers use curl: the token goes in a header it drops on the storage redirect.
      - name: Download the updater signatures
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --paginate \
            --jq '.[] | "\(.id)\t\(.name)"' > assets.tsv
          cut -f2 assets.tsv > assets.txt
          mkdir sigs
          while IFS=$'\t' read -r asset_id name; do
            case "$name" in
              *.sig)
                curl -sSfL --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
                  -o "sigs/$name" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                ;;
              *)
                # Only the updater signatures are needed; every other asset is ignored.
                ;;
            esac
          done < assets.tsv
      - run: node scripts/updater-manifest.mjs --tag "$GITHUB_REF_NAME" --assets assets.txt --sigs sigs --out latest.json
      # The launcher reads releases/latest/download/latest.json, so the name must be exactly that.
      - name: Upload latest.json to the draft
        run: |
          # A re-run replaces the manifest it uploaded before.
          old=$(awk -F'\t' '$2 == "latest.json" { print $1 }' assets.tsv)
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
          curl -sSf -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json"

  notes:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: memory-*
          path: memory-reports
      # A leg whose reference measurement failed uploads no report; the notes say so.
      - run: mkdir -p memory-reports && node scripts/release-notes.mjs memory-reports "$GITHUB_REF_NAME" > notes.md
      - name: Set the draft release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F body=@notes.md --silent
