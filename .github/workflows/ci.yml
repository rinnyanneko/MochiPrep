name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml says "stable"; pin the version the workspace declares in rust-version.
  RUSTUP_TOOLCHAIN: "1.99"

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # mochi-launcher links WebKitGTK and friends, so the whole workspace needs them to compile.
      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # The Rust server embeds apps/web/dist, so the UI must be built before the server compiles.
      - run: pnpm build
      # Uses the Google Chrome preinstalled on the runner (playwright channel: chrome).
      - run: pnpm test:e2e:rust

  bundle:
    uses: ./.github/workflows/build.yml
    with:
      sign-updater: false
      upload-release: false
      release-tag: ""
