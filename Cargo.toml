[workspace]
members = ["crates/*"]
# crates/golden holds fixtures, not a crate.
exclude = ["crates/golden"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: objects keep their key order, as in JS. Request validation names unknown keys in
# the order the client sent them, and Node writes JSON objects in insertion order.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value", "preserve_order"] }
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
num-bigint = "0.4"
num-traits = "0.2"
# HTTP server (crates/mochi-server).
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rand = "0.8"
subtle = "2"
tracing = "0.1"
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
